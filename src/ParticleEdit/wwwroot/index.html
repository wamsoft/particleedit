<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParticleEdit — Effekseer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>ParticleEdit <span class="sub">Effekseer backend</span></h1>
  <div class="actions">
    <button id="btn-templates" type="button">テンプレート</button>
    <span class="divider"></span>
    <input id="project-name" type="text" placeholder="プロジェクト名" spellcheck="false">
    <button id="btn-save" type="button">保存</button>
    <select id="project-list" title="保存済みプロジェクトを読み込む"></select>

    <span class="spacer"></span>
    <span id="status" class="status">起動中…</span>

    <select id="export-format" title="エクスポート形式">
      <option value="efkzip">efkzip (吉里吉里プラグイン用)</option>
      <option value="efk">efk + テクスチャ (zip)</option>
      <option value="efkefc">efkefc + テクスチャ (zip)</option>
    </select>
    <button id="btn-export" type="button" class="primary">エクスポート</button>
  </div>
</header>

<main>
  <section id="preview">
    <canvas id="canvas"></canvas>
    <div id="frame-guide"><span class="frame-label"></span></div>
    <div id="emitter-marker" title="ドラッグで発生位置を動かす"></div>
    <div id="stats"></div>
  </section>
  <aside id="params"></aside>
</main>

<div id="template-overlay" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-head">
      <strong>テンプレート</strong>
      <span class="spacer"></span>
      <input id="template-name" type="text" placeholder="名前" spellcheck="false">
      <button id="btn-add-template" type="button">現在の設定を追加</button>
      <button id="btn-close-templates" type="button">閉じる</button>
    </div>
    <div id="template-grid" class="grid"></div>
  </div>
</div>

<script src="vendor/effekseer.js"></script>
<script src="app.js"></script>
</body>
</html>
